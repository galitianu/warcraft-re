# MOV-0015: does a 1 ms callback less than 8 x 2^-24 s before a frame read that frame's
# X/Y (T7) or does the threshold scale with the float32 grid (Tsub), and does facing
# follow the frame clock (FH) or a 30 ms update-event clock (FU) (docs/mov-0015.md)?
# Variant a: sampler and order start 0.12 s after the setup. Boundary lags fall 2-10 x 2^-24 s
# below 1 s, with lag 7 before an update frame (callback 40): the threshold and
# the X/Y-facing split at it.
# Semantics: docs/scenario-v2.md.
schema: wc3-scenario
version: 2
experiment: MOV-0015
map_revision: MOV-0015-a
units:
  - name: u0
    type: hfoo
    position: [0, 0]
    facing: 0
observe:
  start: 0.12
  period: 0.001
  callbacks: 1000
  properties: [x, "y", facing, order]
  state_clock: 10
actions:
  - at: 0
    unit: u0
    order: move
    target: [1000, 0]
...
