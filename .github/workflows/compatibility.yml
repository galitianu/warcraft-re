name: Primitive compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    # The runner belongs to this repository. Fork code must never reach it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64 AppleClang Release
            id: mac-arm-release
            os: [self-hosted, macOS, ARM64, war3-ci, war3-mac]
            compiler: /usr/bin/clang++
            config: Release
            arch: arm64
            archive: --archive
          - name: macOS ARM64 AppleClang Debug
            id: mac-arm-debug
            os: [self-hosted, macOS, ARM64, war3-ci, war3-mac]
            compiler: /usr/bin/clang++
            config: Debug
            arch: arm64
          - name: Linux x64 GCC Release
            id: linux-gcc-release
            os: [self-hosted, Linux, X64, war3-ci, war3-linux]
            compiler: g++
            config: Release
            arch: x86_64
          - name: Linux x64 Clang Debug
            id: linux-clang-debug
            os: [self-hosted, Linux, X64, war3-ci, war3-linux]
            compiler: clang++
            config: Debug
            arch: x86_64
          # Windows/MSVC is temporarily disabled by the repository owner.
          # Restore it together with summarize_ci.py and dispatch.py's minimum.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'
      - name: Select native x64 MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Build, validate evidence and assess compatibility
        run: >-
          ${{ runner.os == 'Linux' && 'python3' || 'python' }} tools/run_ci.py --build build-ci --compiler "${{ matrix.compiler }}"
          --config ${{ matrix.config }} --expect-arch ${{ matrix.arch }} ${{ matrix.archive }}
      - name: Publish summary even when the gate fails
        if: always()
        shell: bash
        run: |
          if test -f build-ci/ci/reports/summary.md; then
            cat build-ci/ci/reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No CI report produced; consult setup/build logs. This configuration is unverified.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain evidence even when the gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-${{ matrix.id }}
          path: build-ci/ci/
          if-no-files-found: error
          retention-days: 30

  build-scope:
    name: Compare measured build scopes
    needs: compatibility
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, war3-ci, war3-linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Clear previous downloaded evidence
        run: rm -rf build-scope build-scope-report
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: compatibility-*
          path: build-scope
      - name: Compare observation hashes and compatibility across configurations
        run: python3 tools/summarize_ci.py --artifacts build-scope --out build-scope-report
      - name: Publish scope summary
        if: always()
        run: |
          if test -f build-scope-report/summary.md; then
            cat build-scope-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: build-scope
          path: build-scope-report/
          if-no-files-found: error
          retention-days: 30
