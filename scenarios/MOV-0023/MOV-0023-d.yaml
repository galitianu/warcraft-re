# MOV-0023: eastbound unit meets a westbound moving pair
# Semantics: docs/scenario-v1.md.
schema: wc3-scenario
version: 1
experiment: MOV-0023
map_revision: MOV-0023-d
units:
  - name: u0
    type: hfoo
    position: [0, 0]
    facing: 0
  - name: u1
    type: hfoo
    position: [1000, -32]
    facing: 180
  - name: u2
    type: hfoo
    position: [1000, 32]
    facing: 180
observe:
  period: 0.02
  callbacks: 600
  properties: [x, "y", facing, order]
actions:
  - at: 0
    unit: u0
    order: move
    target: [1000, 0]
  - at: 0
    unit: u1
    order: move
    target: [0, -32]
  - at: 0
    unit: u2
    order: move
    target: [0, 32]
...
